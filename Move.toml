[package]
name = "hostit_ticket"
version = "0.1.0"
edition = "2024.beta"
license = "MIT"
authors = ["HostIt contributors"]
# published-at / original-id are tracked in Published.toml (automated address
# management) — the single source of truth for the deployed package versions.

[dependencies]
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "framework/testnet" }

# 0x0 = unpublished: `sui client publish` assigns the new package address and
# writes it back to Published.toml. Reset for the fresh publish (the predict
# settle_after_ms struct change is upgrade-incompatible).
[addresses]
hostit_ticket = "0x0"

[dev-addresses]
hostit_ticket = "0xCAFE"
