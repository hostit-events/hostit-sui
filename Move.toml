[package]
name = "hostit_ticket"
version = "0.1.0"
edition = "2024.beta"
license = "MIT"
authors = ["HostIt contributors"]
# published-at / original-id are tracked in Published.toml (automated address
# management) — the single source of truth for the deployed package versions.

[dependencies]
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "framework/testnet" }

# Original package id of the fresh publish (= Published.toml original-id), so a
# future `sui client upgrade` resolves the named address correctly.
[addresses]
hostit_ticket = "0x80ffb7c9ffe2eee4d69cb69f1bb7fb5403f90aa1492b91e4fdd9fa2dcde3e3f0"

[dev-addresses]
hostit_ticket = "0xCAFE"
