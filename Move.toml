[package]
name = "hostit_ticket"
version = "0.1.0"
edition = "2024.beta"
license = "MIT"
authors = ["HostIt contributors"]
# published-at / original-id are tracked in Published.toml (automated address
# management) — the single source of truth for the deployed package versions.

[dependencies]
# `override = true` resolves the framework-version conflict introduced by the
# openzeppelin_access MVR dep (its transitive Sui/MoveStdlib pins differ); both
# framework deps are pinned to the same rev as the rest of the package.
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "94ad8ccd0ed6c089a9fe072ff80c918b5ab44943", override = true }
MoveStdlib = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/move-stdlib", rev = "94ad8ccd0ed6c089a9fe072ff80c918b5ab44943", override = true }
openzeppelin_access = { r.mvr = "@openzeppelin-move/access" }

# Fresh-publish prep: 0x0 so Sui assigns a NEW package id on publish. The
# post-publish roll sets this to the new original-id (for future upgrades).
[addresses]
hostit_ticket = "0x6eb0f69c91bc8a1a04f15568cfb411bb68c06ced06f55860a94b2f59d1060060"

[dev-addresses]
hostit_ticket = "0xCAFE"
