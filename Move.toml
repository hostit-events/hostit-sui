[package]
name = "hostit_ticket"
version = "0.1.0"
edition = "2024.beta"
license = "MIT"
authors = ["HostIt contributors"]
# published-at / original-id are tracked in Published.toml (automated address
# management) — the single source of truth for the deployed package versions.

[dependencies]
Sui = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/sui-framework", rev = "framework/testnet", override = true }
openzeppelin_access = { r.mvr = "@openzeppelin-move/access" }
MoveStdlib = { git = "https://github.com/MystenLabs/sui.git", subdir = "crates/sui-framework/packages/move-stdlib", rev = "framework/testnet", override = true }

# Fresh-publish prep: 0x0 so Sui assigns a NEW package id on publish. The
# post-publish roll sets this to the new original-id (for future upgrades).
[addresses]
hostit_ticket = "0x6a41303dbb806d02889c78eb887a9d73f63d2ffedcd40c1a36c7f581b7671fcd"

[dev-addresses]
hostit_ticket = "0xCAFE"
